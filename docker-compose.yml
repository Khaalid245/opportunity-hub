version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: opportunity_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opportunity_db}
      POSTGRES_USER: ${POSTGRES_USER:-opportunity_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opportunity_secure_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opportunity_user} -d ${POSTGRES_DB:-opportunity_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opportunity_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-key}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - POSTGRES_DB=${POSTGRES_DB:-opportunity_db}
      - POSTGRES_USER=${POSTGRES_USER:-opportunity_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-opportunity_secure_password_2026}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opportunity_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api}
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  backend_media:
    driver: local
